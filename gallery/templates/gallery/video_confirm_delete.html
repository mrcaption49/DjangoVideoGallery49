{% extends 'gallery/base.html' %}

{% block title %}Delete {{ video.title }}{% endblock %}

{% block content %}
<script>
    // Runs immediately so this page never flashes the wrong theme on load.
    (function () {
        var saved = null;
        try { saved = localStorage.getItem('vv-theme'); } catch (e) {}
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
    })();
</script>
<style>
    /* ---------- Theme-aware overrides for base.html's chrome ---------- */
    body {
        background: #0a0a0b !important;
        color: #f2f1ee !important;
        transition: background-color 0.35s ease, color 0.35s ease;
    }

    .topbar {
        background: #0f0f11 !important;
        border-bottom: 1px solid #232326 !important;
        transition: background-color 0.35s ease, border-color 0.35s ease;
    }

    .topbar .brand {
        color: #f2f1ee !important;
        font-family: 'Sora', 'Inter', sans-serif !important;
        font-weight: 700 !important;
        letter-spacing: 0.01em;
        transition: color 0.35s ease;
    }

    .btn {
        background: #e0293f !important;
        color: #ffffff !important;
    }

    .btn:hover {
        opacity: 1 !important;
        filter: brightness(1.12);
    }

    .messages li {
        background: #141416 !important;
        border: 1px solid #232326 !important;
        color: #f2f1ee !important;
        transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
    }

    .topbar .btn {
        display: none !important;
    }

    html[data-theme="light"] body {
        background: #f7f6f3 !important;
        color: #1c1b19 !important;
    }

    html[data-theme="light"] .topbar {
        background: #ffffff !important;
        border-bottom: 1px solid #e6e3dc !important;
    }

    html[data-theme="light"] .topbar .brand {
        color: #1c1b19 !important;
    }

    html[data-theme="light"] .messages li {
        background: #ffffff !important;
        border: 1px solid #e6e3dc !important;
        color: #1c1b19 !important;
    }

    /* ---------- Theme tokens ---------- */
    #deletePage {
        --bg: #0a0a0b;
        --surface: #141416;
        --surface-2: #1c1c1f;
        --ink: #f2f1ee;
        --ink-dim: #8f8d8a;
        --accent: #e0293f;
        --accent-dim: #7a1420;
        --line: #232326;
        --shadow: rgba(0, 0, 0, 0.6);

        position: relative;
        font-family: 'Inter', sans-serif;
        color: var(--ink);
        transition: color 0.35s ease;
    }

    html[data-theme="light"] #deletePage {
        --bg: #f7f6f3;
        --surface: #ffffff;
        --surface-2: #f0eee8;
        --ink: #1c1b19;
        --ink-dim: #78746c;
        --accent: #d0203a;
        --accent-dim: #f2c3ca;
        --line: #e6e3dc;
        --shadow: rgba(28, 27, 25, 0.1);
    }

    #deletePage * { box-sizing: border-box; }

    #deletePage .confirm-wrap {
        max-width: 560px;
        margin: 4.5rem auto 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 2rem;
        box-shadow: 0 1px 3px var(--shadow);
        text-align: center;
        transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    #deletePage .warn-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.2rem;
        border-radius: 50%;
        background: var(--accent-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: var(--accent);
    }

    #deletePage .form-eyebrow {
        font-family: 'Space Mono', monospace;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 0.5rem;
    }

    #deletePage h1 {
        font-family: 'Sora', 'Inter', sans-serif;
        font-weight: 700;
        font-size: 1.4rem;
        margin: 0 0 0.7rem;
        color: var(--ink);
        line-height: 1.3;
    }

    #deletePage p.hint {
        font-size: 0.9rem;
        color: var(--ink-dim);
        margin: 0 0 1.8rem;
        line-height: 1.55;
    }

    #deletePage .video-title {
        color: var(--ink);
        font-weight: 700;
    }

    #deletePage .form-actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        padding-top: 1.4rem;
        border-top: 1px solid var(--line);
    }

    #deletePage .btn-cancel {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.85rem 1.6rem;
        background: transparent;
        color: var(--ink-dim);
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        transition: color 0.15s ease, border-color 0.15s ease;
    }

    #deletePage .btn-cancel:hover {
        color: var(--ink);
        border-color: var(--accent-dim);
        text-decoration: none;
    }

    #deletePage .btn-delete {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        border: none;
        border-radius: 8px;
        padding: 0.85rem 1.8rem;
        background: var(--accent);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.15s ease;
    }

    #deletePage .btn-delete:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
    }

    @media (max-width: 640px) {
        #deletePage .confirm-wrap { margin-top: 3.5rem; padding: 1.5rem; }
        #deletePage .form-actions { flex-direction: column-reverse; }
        #deletePage .btn-delete,
        #deletePage .btn-cancel { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
        #deletePage * { transition: none !important; }
    }
</style>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<div id="deletePage">
    <div class="confirm-wrap">
        <div class="warn-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <p class="form-eyebrow">Delete video</p>
        <h1>Delete <span class="video-title">"{{ video.title }}"</span>?</h1>
        <p class="hint">This will permanently remove the video file and its details. This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <a class="btn-cancel" href="{% url 'video_detail' video.pk %}">Cancel</a>
                <button class="btn-delete" type="submit"><i class="bi bi-trash3"></i> Delete permanently</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
