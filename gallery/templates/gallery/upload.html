{% extends 'gallery/base.html' %}

{% block title %}Upload Video{% endblock %}

{% block content %}
<style>
	.form-wrap {
		max-width: 560px;
		margin: 0 auto;
		background: var(--surface);
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 1.75rem;
	}

	.form-wrap h1 {
		margin-top: 0;
	}

	.field {
		margin-bottom: 1.1rem;
	}

	.field label {
		display: block;
		font-size: 0.85rem;
		color: var(--ink-dim);
		margin-bottom: 0.35rem;
	}

	.field input[type="text"],
	.field textarea,
	.field input[type="file"] {
		width: 100%;
		padding: 0.6rem 0.7rem;
		background: var(--surface-2);
		border: 1px solid var(--border);
		border-radius: 6px;
		color: var(--ink);
		font-family: inherit;
		font-size: 0.9rem;
	}

	.field textarea { resize: vertical; }

	.errorlist {
		list-style: none;
		padding: 0;
		margin: 0.3rem 0 0;
		color: #ff8a8a;
		font-size: 0.8rem;
	}
</style>

<div class="form-wrap">
	<h1>Upload a video</h1>
	<form method="post" enctype="multipart/form-data">
		{% csrf_token %}

		<div class="field">
			<label for="{{ form.title.id_for_label }}">Title</label>
			{{ form.title }}
			{{ form.title.errors }}
		</div>

		<div class="field">
			<label for="{{ form.description.id_for_label }}">Description</label>
			{{ form.description }}
			{{ form.description.errors }}
		</div>

		<div class="field">
			<label for="{{ form.video_file.id_for_label }}">Video file</label>
			{{ form.video_file }}
			{{ form.video_file.errors }}
		</div>

		<button class="btn" type="submit">Upload</button>
	</form>
</div>
{% endblock %}
