{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{% block title %}Video Gallery{% endblock %}</title>
	<style>
		:root {
			--bg: #0f1115;
			--surface: #171a21;
			--surface-2: #1f232c;
			--ink: #eef0f4;
			--ink-dim: #9aa2b1;
			--accent: #6ea8fe;
			--border: #2a2f3a;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			background: var(--bg);
			color: var(--ink);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			line-height: 1.5;
		}

		a { color: var(--accent); text-decoration: none; }
		a:hover { text-decoration: underline; }

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 1rem 1.75rem;
			border-bottom: 1px solid var(--border);
			background: var(--surface);
		}

		.topbar .brand {
			font-size: 1.15rem;
			font-weight: 700;
			color: var(--ink);
		}

		.topbar .brand:hover { text-decoration: none; }

		.btn {
			display: inline-block;
			padding: 0.55rem 1.1rem;
			border-radius: 6px;
			background: var(--accent);
			color: #0f1115;
			font-weight: 600;
			font-size: 0.9rem;
			border: none;
			cursor: pointer;
		}

		.btn:hover { opacity: 0.9; text-decoration: none; }

		.container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 2rem 1.75rem 4rem;
		}

		.messages {
			list-style: none;
			margin: 0 0 1.5rem;
			padding: 0;
		}

		.messages li {
			padding: 0.7rem 1rem;
			border-radius: 6px;
			background: var(--surface-2);
			border: 1px solid var(--border);
			color: var(--ink);
			margin-bottom: 0.5rem;
			font-size: 0.9rem;
		}
	</style>
</head>
<body>
	<div class="topbar">
		<a class="brand" href="{% url 'gallery_list' %}">🎬 Video Gallery</a>
		<a class="btn" href="{% url 'upload_video' %}">Upload video</a>
	</div>

	<div class="container">
		{% if messages %}
		<ul class="messages">
			{% for message in messages %}
			<li>{{ message }}</li>
			{% endfor %}
		</ul>
		{% endif %}

		{% block content %}{% endblock %}
	</div>
</body>
</html>
